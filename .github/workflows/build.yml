name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Cookr.sln

      - name: Build
        run: dotnet build Cookr.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Cookr.sln --configuration Release --no-build
